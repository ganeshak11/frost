# Frost / Obsidian Glass for kitty. Included at the end of kitty.conf, so it
# overrides the colours there. Remove the `include frost-obsidian.conf` line
# to go back.

# glass: translucent black with KWin blur behind it
background            #0b0b0e
background_opacity    0.82
background_blur       32
foreground            #ECECF1

cursor                #F21D43
cursor_text_color     #0b0b0e
selection_foreground  #ffffff
selection_background  #7a1024
url_color             #ff6b86
url_style             curly

# tabs: red pill for the active tab
tab_bar_style         fade
tab_bar_background    #0b0b0e
active_tab_foreground   #ffffff
active_tab_background   #F21D43
active_tab_font_style   bold
inactive_tab_foreground #9A9AA6
inactive_tab_background #16161b
tab_title_template    " {index}: {title} "

active_border_color   #F21D43
inactive_border_color #2a2a31

# palette tuned to the red accent
color0   #1a1a1f
color8   #4a4a55
color1   #F21D43
color9   #ff5c78
color2   #4ade80
color10  #86efac
color3   #fbbf24
color11  #fde68a
color4   #60a5fa
color12  #93c5fd
color5   #f472b6
color13  #f9a8d4
color6   #5eead4
color14  #99f6e4
color7   #d4d4dc
color15  #ffffff

# type: JetBrains Mono, with the Nerd Font kept for icons (Private Use Area)
font_family           JetBrains Mono
bold_font             JetBrains Mono ExtraBold
symbol_map            U+E000-U+F8FF,U+F0000-U+FFFFD CaskaydiaCove Nerd Font
